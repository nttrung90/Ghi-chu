plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services" version "4.4.1" apply false
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '0.1.0'
}

// Đọc thông tin keystore release từ android/key.properties (file này không commit lên git)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseSigning = false
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
    hasReleaseSigning =
        (keystoreProperties['storeFile'] ?: '').trim() &&
        (keystoreProperties['storePassword'] ?: '').trim() &&
        (keystoreProperties['keyAlias'] ?: '').trim() &&
        (keystoreProperties['keyPassword'] ?: '').trim()
    if (!hasReleaseSigning) {
        logger.warn('key.properties chưa điền đủ thông tin — build release sẽ tạm dùng DEBUG key.')
    }
}

android {
    namespace "com.ntt.notentt"
    // Hỗ trợ Android SDK 36 (Android 16)
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.ntt.notentt"
        // Hỗ trợ Android 8.0 Oreo trở lên (API 26)
        minSdkVersion 26
        // Mục tiêu Android 16 (SDK 36)
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties['storeFile'].trim())
                storePassword keystoreProperties['storePassword'].trim()
                keyAlias keystoreProperties['keyAlias'].trim()
                keyPassword keystoreProperties['keyPassword'].trim()
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}
