name: note_ntt
description: "Ứng dụng ghi chú T-Note hỗ trợ đồng bộ đa nền tảng qua Firebase."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Quản lý trạng thái (State Management)
  provider: ^6.1.2

  # Firebase SDK cho Flutter (Chính chủ Google)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Lưu trữ cục bộ & Offline-first
  shared_preferences: ^2.3.2

  # Tiện ích tạo ID và định dạng thời gian
  uuid: ^4.5.1
  intl: ^0.19.0

  # Icon và hiệu ứng giao diện Material Design
  flutter_staggered_grid_view: ^0.7.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true
